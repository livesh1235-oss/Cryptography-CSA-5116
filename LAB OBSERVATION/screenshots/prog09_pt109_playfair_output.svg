<text x="30" y="97" fill="#bd93f9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">--- 9. PT-109 Wireless Playfair Decryption ---</text>
<text x="30" y="117" fill="#f1fa8c" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Keyword: ROYAL NEW ZEALAND NAVY</text>
<text x="30" y="137" fill="#f1fa8c" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Playfair 5x5 Key Matrix:</text>
<text x="30" y="157" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">R O Y A L </text>
<text x="30" y="177" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">N E W Z D </text>
<text x="30" y="197" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">V B C F G </text>
<text x="30" y="217" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">H I K M P </text>
<text x="30" y="237" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Q S T U X </text>
<text x="30" y="257" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="277" fill="#50fa7b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Decrypted Message:</text>
<text x="30" y="297" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">PTBOATONEOWENINELOSTINACTIONINBLACKESSSTRAITTWOMILESSWMERESUCOVEXCREWOFTWELVEXREQUESTANYINFORMATIONX</text>
<text x="30" y="317" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="337" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Formatted English Interpretation:</text>
<text x="30" y="357" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">&quot;PT ONE O NINE LOST IN ACTION IN BLACKETT STRAIT TWO MILES SW OF MERESU</text>
<text x="30" y="377" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">COVE X CREW OF ELEVEN SURVIVORS ON VASU VASU ISLAND X ALL IN NEED OF RESCUE&quot;</text>
