<text x="410.0" y="32" fill="#a6adc8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="12" font-weight="600" text-anchor="middle">prog29_sha3_sponge.c — Execution Output</text>
<text x="30" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">
<tspan fill="#50fa7b" font-weight="bold">student@simats-cse</tspan><tspan fill="#6c7086">:</tspan><tspan fill="#8be9fd">~/csa51</tspan><tspan fill="#f8f8f2">$ </tspan><tspan fill="#f1fa8c">./prog29_sha3_sponge</tspan>
</text>
<text x="30" y="97" fill="#bd93f9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">--- 29. SHA-3 Keccak Capacity Lane Diffusion ---</text>
<text x="30" y="117" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="137" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Parameters:</text>
<text x="30" y="157" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Total state size b = 1600 bits = 25 lanes (64 bits each)</text>
<text x="30" y="177" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Rate r             = 1024 bits = 16 lanes</text>
<text x="30" y="197" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Capacity c         =  576 bits =  9 lanes</text>
<text x="30" y="217" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="237" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Initial State:</text>
<text x="30" y="257" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Rate lanes (P0):     16 lanes (all contain nonzero bits)</text>
<text x="30" y="277" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Capacity lanes:       9 lanes (all initialized to zero)</text>
<text x="30" y="297" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="317" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Diffusion Analysis:</text>
<text x="30" y="337" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">1. In the first round of Keccak-f:</text>
<text x="30" y="357" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   - Theta (theta) step XORs each bit with parity of adjacent columns.</text>
<text x="30" y="377" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   - Chi (chi) step non-linearly combines bits across rows.</text>
<text x="30" y="397" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   - After just ONE permutation round, nonzero bits from the 16 rate lanes</text>
<text x="30" y="417" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">     propagate into all 9 capacity lanes.</text>
<text x="30" y="437" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">2. Therefore, it takes only 1 round of the Keccak-f[1600] permutation</text>
<text x="30" y="457" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   for all 9 capacity lanes to have at least one nonzero bit.</text>
</svg>