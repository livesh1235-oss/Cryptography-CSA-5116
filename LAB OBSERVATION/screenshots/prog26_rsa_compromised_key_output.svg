<tspan fill="#50fa7b" font-weight="bold">student@simats-cse</tspan><tspan fill="#6c7086">:</tspan><tspan fill="#8be9fd">~/csa51</tspan><tspan fill="#f8f8f2">$ </tspan><tspan fill="#f1fa8c">./prog26_rsa_compromised_key</tspan>
</text>
<text x="30" y="97" fill="#bd93f9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">--- 26. RSA Compromised Key Modulus Reuse ---</text>
<text x="30" y="117" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="137" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Question: If Bob leaks private key d, is it safe to pick new (e&#x27;, d&#x27;) with the same n?</text>
<text x="30" y="157" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Answer: NO, IT IS COMPLETELY INSECURE.</text>
<text x="30" y="177" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="197" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Explanation:</text>
<text x="30" y="217" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">1. Once (e, d) is known for modulus n, the product (e*d - 1) is a multiple of phi(n).</text>
<text x="30" y="237" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">2. A standard probabilistic algorithm can factor n = p*q in polynomial time</text>
<text x="30" y="257" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   using (e*d - 1).</text>
<text x="30" y="277" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">3. Anyone who recorded the old leaked key can instantly factor n, compute the new phi(n),</text>
<text x="30" y="297" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">   and derive Bob&#x27;s new private key d&#x27; from his new public key e&#x27;.</text>
<text x="30" y="317" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">4. Rule: Once a private key is leaked, a FRESH modulus n (new p and q) MUST be generated.</text>
</svg>