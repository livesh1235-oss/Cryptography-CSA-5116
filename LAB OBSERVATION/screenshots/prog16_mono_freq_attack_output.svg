<text x="30" y="97" fill="#bd93f9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">--- 16. Frequency Analysis on Monoalphabetic Substitution ---</text>
<text x="30" y="117" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="137" fill="#ff79c6" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Ciphertext:</text>
<text x="30" y="157" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">GDUC QCIK JGIYDO YI GDUC GZCYM GU OWFFCII. YERYDO DI GZCYM GU DUOPCYM GDUC JGIYDO.</text>
<text x="30" y="177" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="197" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Derived Frequency Mapping (Cipher -&gt; English Guess):</text>
<text x="30" y="217" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">G(9)-&gt;E  D(8)-&gt;T  C(8)-&gt;A  Y(8)-&gt;O  I(7)-&gt;I  U(6)-&gt;N  O(5)-&gt;S  M(3)-&gt;H  J(2)-&gt;R  F(2)-&gt;D  Z(2)-&gt;L  Q(1)-&gt;C  W(1)-&gt;U  K(1)-&gt;M  E(1)-&gt;W  P(1)-&gt;F  R(1)-&gt;G  </text>
<text x="30" y="237" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="257" fill="#50fa7b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Candidate Plaintext Decryption:</text>
<text x="30" y="277" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">ETNA CAIM REIOTS OI ETNA ELAOH EN SUDDAII. OWGOTS TI ELAOH EN TNSFAOH ETNA REIOTS.</text>
