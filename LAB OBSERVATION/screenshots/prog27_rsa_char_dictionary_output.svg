<text x="410.0" y="32" fill="#a6adc8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="12" font-weight="600" text-anchor="middle">prog27_rsa_char_dictionary.c — Execution Output</text>
<text x="30" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">
<tspan fill="#50fa7b" font-weight="bold">student@simats-cse</tspan><tspan fill="#6c7086">:</tspan><tspan fill="#8be9fd">~/csa51</tspan><tspan fill="#f8f8f2">$ </tspan><tspan fill="#f1fa8c">./prog27_rsa_char_dictionary</tspan>
</text>
<text x="30" y="97" fill="#bd93f9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">--- 27. RSA Single-Character Dictionary Vulnerability ---</text>
<text x="30" y="117" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="137" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Parameters: e = 31, n = 3599</text>
<text x="30" y="157" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Precomputed Dictionary for A-Z (0-25):</text>
<text x="30" y="177" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  &#x27;A&#x27; ( 0) -&gt; Cipher:    0</text>
<text x="30" y="197" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  &#x27;B&#x27; ( 1) -&gt; Cipher:    1</text>
<text x="30" y="217" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  &#x27;C&#x27; ( 2) -&gt; Cipher: 3536</text>
<text x="30" y="237" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  &#x27;D&#x27; ( 3) -&gt; Cipher:  186</text>
<text x="30" y="257" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  &#x27;E&#x27; ( 4) -&gt; Cipher:  370</text>
<text x="30" y="277" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  ... (all 26 values easily precomputed)</text>
<text x="30" y="297" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="317" fill="#ff79c6" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Intercepted Ciphertext for Alice&#x27;s secret message:</text>
<text x="30" y="337" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  1701 370 233 233 807 </text>
<text x="30" y="357" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="377" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Eve decodes via table lookup without private key:</text>
<text x="30" y="397" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">  Decoded: HELLO</text>
<text x="30" y="417" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13"></text>
<text x="30" y="437" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">Conclusion: Encrypting small deterministic alphabetic tokens individually</text>
<text x="30" y="457" fill="#cdd6f4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace" font-size="13">is completely broken by precomputed codebook attack. RSA must use randomized padding (OAEP).</text>
</svg>